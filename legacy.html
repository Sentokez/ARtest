        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #viewer { width: 100%; height: 100%; position: absolute; }
        
        #loadingScreen { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .loading-icon { width: 80px; height: 80px; color: #f97316; margin-bottom: 20px; }
        .loading-text { font-weight: 900; font-size: 12px; text-transform: uppercase; color: #f97316; letter-spacing: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .ui-layer { position: absolute; z-index: 1000; pointer-events: none; width: 100%; height: 100%; }
        .ui-layer * { pointer-events: auto; }

        .audio-bar { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 30px; backdrop-filter: blur(10px); }
        .btn-audio { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; }
        .btn-audio svg { width: 22px; height: 22px; fill: currentColor; }

        .sidebar { 
            position: absolute; top: 50%; left: 15px; transform: translateY(-50%); 
            width: 170px; max-height: 60vh; 
            background: rgba(255,255,255,0.08); backdrop-filter: blur(25px); 
            border-radius: 28px; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; flex-direction: column; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
        }
        .sidebar.collapsed { transform: translateY(-50%) translateX(-220px); opacity: 0; pointer-events: none; }
        .sidebar-header { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; font-weight: 900; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; text-align: center; opacity: 0.7; }
        .gallery { flex: 1; overflow-y: auto; padding: 10px; scrollbar-width: none; }
        .gallery::-webkit-scrollbar { display: none; }
        .scene-item { cursor: pointer; border-radius: 14px; overflow: hidden; margin-bottom: 10px; position: relative; border: 2px solid transparent; transition: all 0.3s; }
        .scene-item:hover, .scene-item.active { border-color: #284985; transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .scene-item img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
        .scene-item span { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; font-size: 9px; padding: 6px; text-align: center; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .toggle-btn { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); z-index: 1001; background: #284985; border: none; color: white; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(12, 43, 146, 0.4); transition: all 0.3s; }
        .sidebar:not(.collapsed) ~ .toggle-btn { left: 200px; background: rgba(0,0,0,0.4); }

        .lang-selector { position: absolute; bottom: 20px; right: 20px; z-index: 1002; display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; }
        .lang-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 2px solid #f97316; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.3s; }
        .lang-list { display: none; flex-direction: column-reverse; gap: 6px; padding-bottom: 10px; }
        .lang-selector:hover .lang-list { display: flex; }

        .btn-close:hover { transform: rotate(90deg) scale(1.1); }

<style>
  #ozel-loading-screen {
    position: fixed;

    align-items: center;

  }

  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid #3b82f6; /* Halkanın dönen renkli kısmı (Örn: Canlı Mavi) */
    border-radius: 50%;
    margin: 0 auto 15px auto;
    animation: dondur 1s linear infinite;
  }
  .loading-yazi {
    color: #ffffff;
    font-size: 16px;
    letter-spacing: 1px;
    margin: 0;
  }
  @keyframes dondur {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  /* Ekranı kapatırken kullanılacak pürüzsüz kaybolma sınıfı */
  #ozel-loading-screen.kaybol {
    opacity: 0;
    visibility: hidden;
  }

        let currentLang = "tr";
        const bgMusic = document.getElementById('bgMusic');
        const audioBar = document.getElementById('audioBar');
        const gallery = document.getElementById('gallery');
        const sidebar = document.getElementById('sidebar');
        const infoOverlay = document.getElementById('infoOverlay');
        const infoTextEl = document.getElementById('infoText');
        const infoImgEl = document.getElementById('infoImg');
        const activeLangBtn = document.getElementById('activeLangBtn');
        const loadingScreen = document.getElementById('loadingScreen');
        const dynamicStyles = document.getElementById('dynamicStyles');

        function updateInfoLabels() {
          const label = trans[currentLang].infoLabel || "INFO";
          dynamicStyles.innerText = '.vt-hotspot.type-info::after { content: "' + label + '"; }';
        }

        const viewer = pannellum.viewer('viewer', {
            "default": { 
              "firstScene": config.firstSceneId, 
              "sceneFadeDuration": 800, 
              "autoLoad": true, 
              "crossOrigin": "anonymous"
            },
            "scenes": config.scenes
        });

        viewer.on('load', () => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => loadingScreen.style.display = 'none', 500);
          
          const sid = viewer.getScene(); const sdata = config.scenes[sid];
          if(sdata.audio) {
            audioBar.style.display = 'flex';
            if(bgMusic.src !== location.origin + '/' + sdata.audio) {
              bgMusic.src = sdata.audio;
              bgMusic.play().catch(() => {
                document.addEventListener('click', () => bgMusic.play(), { once: true });
              });
            } else if(bgMusic.paused) {
              bgMusic.play().catch(() => {});
            }
          } else { audioBar.style.display = 'none'; bgMusic.pause(); }
          
          renderGallery(sid);
        });

        function changeLang(code) {
          currentLang = code;
          const lData = [{"code":"tr","name":"Türkçe","flag":"🇹🇷"},{"code":"en","name":"English","flag":"🇺🇸"},{"code":"de","name":"Deutsch","flag":"🇩🇪"},{"code":"fr","name":"Français","flag":"🇫🇷"},{"code":"es","name":"Español","flag":"🇪🇸"},{"code":"hi","name":"हिन्दी","flag":"🇮🇳"}];
          const l = lData.find(x => x.code === code);
          activeLangBtn.innerText = l ? l.flag : '🌐';
          document.getElementById('labelScenes').innerText = trans[code].scenes;
          document.getElementById('loadingLabel').innerText = trans[code].loading;
          updateInfoLabels();
          renderGallery(viewer.getScene());
        }

        function toggleSidebar() { sidebar.classList.toggle('collapsed'); }
        
        function openInfo(text, img) { 
          infoTextEl.innerText = text; 
          if(img) {
            infoImgEl.src = img;
            infoImgEl.style.display = 'block';
          } else {
            infoImgEl.style.display = 'none';
          }
          infoOverlay.classList.add('active'); 
        }
        
        function closeInfo() { infoOverlay.classList.remove('active'); }
        
        function togglePlay() {
          if (bgMusic.paused) {
            bgMusic.play();
            document.getElementById('svgPause').style.display = 'block';
            document.getElementById('svgPlay').style.display = 'none';
          } else {
            bgMusic.pause();
            document.getElementById('svgPause').style.display = 'none';
            document.getElementById('svgPlay').style.display = 'block';
          }
        }

        function toggleMute() {
          bgMusic.muted = !bgMusic.muted;
          document.getElementById('svgMute').style.display = bgMusic.muted ? 'none' : 'block';
          document.getElementById('svgUnmute').style.display = bgMusic.muted ? 'block' : 'none';
        }

        function setVolume(v) { bgMusic.volume = v; }

        function renderGallery(activeId) {
          gallery.innerHTML = '';
          Object.keys(config.scenes).forEach(id => {
            const scene = config.scenes[id];
            const div = document.createElement('div');
            div.className = 'scene-item' + (id === activeId ? ' active' : '');
            div.onclick = () => { 
              if(id !== viewer.getScene()) {
                viewer.loadScene(id); 
              }
              if(window.innerWidth < 1024) toggleSidebar(); 
            };
            div.innerHTML = '<img src="' + scene.panorama + '"><span>' + scene.title + '</span>';
            gallery.appendChild(div);
          });
        }

        updateInfoLabels();
        renderGallery(config.firstSceneId);

        window.addEventListener('click', (e) => {
          const target = e.target.closest('.type-info');
          if(target) {
            const hsId = Array.from(target.classList).find(c => c.startsWith('hs-id-')).split('hs-id-')[1];
            const sceneId = viewer.getScene();
            const hs = config.scenes[sceneId].hotSpots.find(h => h.cssClass.includes(hsId));
            if(hs) openInfo(hs.description || hs.text, hs.coverImage);
          }
        });
