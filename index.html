<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ankara Üniversitesi · Müze Sanal Turu</title>
<link rel="stylesheet" href="vendor/pannellum.css"><link rel="stylesheet" href="tour.css">
<script defer src="vendor/pannellum.js"></script><script type="module" src="tour.js"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><img src="images/kurumsal-logo.png" alt="Ankara Üniversitesi"><span>ANKARA ÜNİVERSİTESİ<small>Müze · 360° sanal tur</small></span></a><div class="header-actions"></div></header>
<div class="workspace">
<aside class="scenes-panel" id="scenesPanel"><div class="panel-title"><div><span class="eyebrow">TUR İÇERİĞİ</span><h1>Sahneler <span id="sceneCount" class="count"></span></h1></div></div><label class="search-label"><span class="sr-only">Sahne ara</span><input id="search" type="search" placeholder="Sahnelerde ara…"></label><nav id="sceneList" aria-label="Tur sahneleri"></nav></aside>
<main class="stage" id="stage"><div id="panorama" aria-label="360 derece panorama"></div><div class="stage-heading"><span class="eyebrow" id="modeLabel">SANAL TUR</span><h2 id="sceneHeading"></h2></div><div id="loading" role="status"><img src="images/kurumsal-logo.png" alt=""><span id="loadingText">Sanal tur yükleniyor…</span><button id="retry" hidden>Yeniden dene</button></div><div class="stage-bottom"><button id="toggleScenes" aria-label="Sahne listesini aç veya kapat">☰ Sahneler</button><span id="viewHint">Bakmak için sürükleyin · Yakınlaştırmak için kaydırın</span><div class="view-controls"><button id="audioToggle" hidden>♫ Sesi oynat</button><button id="zoomOut" aria-label="Uzaklaştır">−</button><button id="zoomIn" aria-label="Yakınlaştır">+</button><button id="fullscreen" aria-label="Tam ekran">⛶</button></div></div><div class="logos"><img src="images/kurumsal-logo2.png" alt="Ankara Üniversitesi"><img src="images/kurumsal-logo3.png" alt="Müze logosu"></div></main>

</div>

<dialog id="contentDialog"><button id="closeContent" class="dialog-close" aria-label="Kapat">×</button><div id="contentBody"></div></dialog><div id="toast" role="status" hidden></div><audio id="audio" loop></audio>
</body></html>
