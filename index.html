        let currentLang = "tr";
        const bgMusic = document.getElementById('bgMusic');
        const audioBar = document.getElementById('audioBar');
        const gallery = document.getElementById('gallery');
        const sidebar = document.getElementById('sidebar');
        const infoOverlay = document.getElementById('infoOverlay');
        const infoTextEl = document.getElementById('infoText');
        const infoImgEl = document.getElementById('infoImg');
        const activeLangBtn = document.getElementById('activeLangBtn');
        const loadingScreen = document.getElementById('loadingScreen');
        const dynamicStyles = document.getElementById('dynamicStyles');

        function updateInfoLabels() {
          const label = trans[currentLang].infoLabel || "INFO";
          dynamicStyles.innerText = '.vt-hotspot.type-info::after { content: "' + label + '"; }';
        }

        const viewer = pannellum.viewer('viewer', {
            "default": { 
              "firstScene": config.firstSceneId, 
              "sceneFadeDuration": 800, 
              "autoLoad": true, 
              "autoRotate": -0.8,
              "crossOrigin": "anonymous"
            },
            "scenes": config.scenes
        });

        viewer.on('load', () => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => loadingScreen.style.display = 'none', 500);
          
          const sid = viewer.getScene(); const sdata = config.scenes[sid];
          if(sdata.audio) {
            audioBar.style.display = 'flex';
            if(bgMusic.src !== location.origin + '/' + sdata.audio) {
              bgMusic.src = sdata.audio;
              bgMusic.play().catch(() => {
                document.addEventListener('click', () => bgMusic.play(), { once: true });
              });
            } else if(bgMusic.paused) {
              bgMusic.play().catch(() => {});
            }
          } else { audioBar.style.display = 'none'; bgMusic.pause(); }
          
          renderGallery(sid);
        });

        function changeLang(code) {
          currentLang = code;
          const lData = [{"code":"tr","name":"Türkçe","flag":"🇹🇷"},{"code":"en","name":"English","flag":"🇺🇸"},{"code":"de","name":"Deutsch","flag":"🇩🇪"},{"code":"fr","name":"Français","flag":"🇫🇷"},{"code":"es","name":"Español","flag":"🇪🇸"},{"code":"hi","name":"हिन्दी","flag":"🇮🇳"}];
          const l = lData.find(x => x.code === code);
          activeLangBtn.innerText = l ? l.flag : '🌐';
          document.getElementById('labelScenes').innerText = trans[code].scenes;
          document.getElementById('loadingLabel').innerText = trans[code].loading;
          updateInfoLabels();
          renderGallery(viewer.getScene());
        }

        function toggleSidebar() { sidebar.classList.toggle('collapsed'); }
        
        function openInfo(text, img) { 
          infoTextEl.innerText = text; 
          if(img) {
            infoImgEl.src = img;
            infoImgEl.style.display = 'block';
          } else {
            infoImgEl.style.display = 'none';
          }
          infoOverlay.classList.add('active'); 
        }
        
        function closeInfo() { infoOverlay.classList.remove('active'); }
        
        function togglePlay() {
          if (bgMusic.paused) {
            bgMusic.play();
            document.getElementById('svgPause').style.display = 'block';
            document.getElementById('svgPlay').style.display = 'none';
          } else {
            bgMusic.pause();
            document.getElementById('svgPause').style.display = 'none';
            document.getElementById('svgPlay').style.display = 'block';
          }
        }

        function toggleMute() {
          bgMusic.muted = !bgMusic.muted;
          document.getElementById('svgMute').style.display = bgMusic.muted ? 'none' : 'block';
          document.getElementById('svgUnmute').style.display = bgMusic.muted ? 'block' : 'none';
        }

        function setVolume(v) { bgMusic.volume = v; }

        function renderGallery(activeId) {
          gallery.innerHTML = '';
          Object.keys(config.scenes).forEach(id => {
            const scene = config.scenes[id];
            const div = document.createElement('div');
            div.className = 'scene-item' + (id === activeId ? ' active' : '');
            div.onclick = () => { 
              if(id !== viewer.getScene()) {
                viewer.loadScene(id); 
              }
              if(window.innerWidth < 1024) toggleSidebar(); 
            };
            div.innerHTML = '<img src="' + scene.panorama + '"><span>' + scene.title + '</span>';
            gallery.appendChild(div);
          });
        }

        updateInfoLabels();
        renderGallery(config.firstSceneId);

        window.addEventListener('click', (e) => {
          const target = e.target.closest('.type-info');
          if(target) {
            const hsId = Array.from(target.classList).find(c => c.startsWith('hs-id-')).split('hs-id-')[1];
            const sceneId = viewer.getScene();
            const hs = config.scenes[sceneId].hotSpots.find(h => h.cssClass.includes(hsId));
            if(hs) openInfo(hs.description || hs.text, hs.coverImage);
          }
        });
    </script>
